<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vertikis</title>
    <meta name="description" content="Vertikis: criaturas blandas de colores que se empujan, se arrastran y se inflan hasta explotar como globos. Un experimento de VERTIK." />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- El escenario: todo lo que se mueve se dibuja aquí con JavaScript. -->
    <canvas data-cells aria-label="Vertikis: criaturas de colores que se pueden arrastrar" role="img"></canvas>

    <!-- Pie con las instrucciones y los créditos. -->
    <p class="credit">
      <span class="credit__tag">vertikis</span>
      Puedes arrastrar, tocar para inflar o tocar dos veces en un hueco para crear<span class="credit__sep">·</span><wbr />Homenaje a yugop.com — Yugo Nakamura, 2005<span class="credit__sep">·</span><wbr /><span class="credit__modes"><button type="button" data-mode-prev aria-label="Visualización anterior">← Prev</button><span class="credit__sep">·</span><button type="button" data-mode-next aria-label="Visualización siguiente">Next →</button></span>
    </p>

    <!-- Compartir una foto de cómo están ahora los vertikis. Si el navegador no sabe
         compartir imágenes, no aparece (ver vertikis.js, «Extra · Compartir»). -->
    <button type="button" class="share" data-share hidden aria-label="Compartir una imagen de los vertikis">
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="M8.6 10.5 15.4 6.5M8.6 13.5l6.8 4" fill="none" />
        <circle cx="18" cy="5" r="3" stroke="none" />
        <circle cx="6" cy="12" r="3" stroke="none" />
        <circle cx="18" cy="19" r="3" stroke="none" />
      </svg>
    </button>

    <!-- Un script normal (no un módulo): así funciona también abriendo el archivo con doble clic. -->
    <script src="vertikis.js"></script>
  </body>
</html>
