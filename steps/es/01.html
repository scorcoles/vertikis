<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vertikis · paso 1: El escenario</title>
    <style>
      html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; overscroll-behavior: none; }
      canvas {
        position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none;
      }
      .step {
        position: fixed; left: 8px; top: 8px; z-index: 1; max-width: calc(100vw - 16px); margin: 0;
        font: 10px/1.6 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.04em; color: #000;
        pointer-events: none;
      }
      .step b { display: inline-block; padding: 2px 5px; background: #000; color: #fff; font-weight: normal; text-transform: uppercase; }
      .step a { color: inherit; pointer-events: auto; margin-right: 8px; }
    </style>
  </head>
  <body>
    <canvas data-cells></canvas>
    <p class="step">
      <b>paso 1 de 16 · El escenario</b><br />
      Un círculo dibujado en un canvas que ocupa toda la ventana.<br />
      <a href="02.html">siguiente →</a><a href="https://github.com/scorcoles/vertikis/blob/main/README.md#paso-1">tutorial</a>
    </p>
    <script>
      // Vertikis: criaturas blandas de colores, con cara, que caen, se empujan y se deforman al
      // chocar, y que se pueden arrastrar, reventar y crear. Un experimento de VERTIK.
      // Homenaje a la home de yugop.com (Yugo Nakamura, 2005).

      // =========================================================================================
      // Paso 1 · El escenario: un canvas que ocupa la ventana
      // =========================================================================================

      const canvas = document.querySelector('[data-cells]');
      // El «pincel» con el que dibujamos en el canvas.
      const ctx = canvas.getContext('2d');

      // Ancho y alto del escenario, en píxeles CSS.
      let W = 0;
      let H = 0;

      function resize() {
        // En pantallas retina hay 2 píxeles reales por cada píxel CSS: dibujamos al doble para
        // que se vea nítido (como mucho ×2, para no gastar de más).
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        // A partir de aquí dibujamos en píxeles CSS y el navegador multiplica por dpr.
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      // Para probar: un círculo rojo en el centro.
      function draw() {
        ctx.fillStyle = 'tomato';
        ctx.beginPath();
        ctx.arc(W / 2, H / 2, Math.min(W, H) * 0.2, 0, Math.PI * 2);
        ctx.fill();
      }

      // =========================================================================================
      // ¡Arrancamos!
      // =========================================================================================

      window.addEventListener('resize', () => {
        resize();
        draw();
      });
      resize();
      draw();
    </script>
  </body>
</html>
